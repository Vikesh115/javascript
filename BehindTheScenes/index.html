<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul id="myList">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Grapes</li>
    </ul>

    <script>
        // Get the unordered list element
        const list = document.getElementById('myList');

        // Get all list items
        const listItems = list.getElementsByTagName('li');

        // Create an array to store the list item content
        const itemContentArray = [];

        // Loop through each list item and store its content in the array
        for (let i = 0; i < listItems.length; i++) {
            itemContentArray.push(listItems[i].textContent);
        }

        // Now the itemContentArray contains all the list item content
        console.log(itemContentArray); // Output: ["Apple", "Banana", "Orange", "Grapes"]
    </script>
</body>

</html>
